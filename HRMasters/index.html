<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRMasters</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="body-crud">
    <nav class="navbar">
        <div class="sidebar">
            <img src="assets/logo-3-hrmasters.png" alt="Logo HRMasters" class="logo" id="logo-sidebar">
            <form id="form-criar">
                <div>
                    <label for="criar-nome">??</label>
                    <input type="text" placeholder="Nome completo" id="criar-nome" required>
                </div>
                <div>
                    <label for="criar-email">??</label>
                    <input type="email" placeholder="Email coorporativo" id="criar-email" required>
                </div>
                <div>
                    <label for="criar-endereco">??</label>
                    <input type="text" placeholder="Endereço" id="criar-endereco" required>
                </div>
                <div>
                    <label for="criar-codigo">??</label>
                    <input type="number" placeholder="Código de funcionário" id="criar-codigo" required>
                </div>
                <div>
                    <label for="criar-salario">??</label>
                    <input type="number" placeholder="Salário" id="criar-salario" required>
                </div>
                <div class="checkbox">
                    <label for="criar-ativo">??</label>
                    <span>Funcionário ativo?</span>
                    <input type="checkbox" id="criar-ativo" required>
                </div>
                <div class="submit-button">
                    <button>Cadastrar</button>
                </div>
            </form>
            <div class="sidebar-footer">
                <button id="logout-button">Sair</button>
            </div>
        </div>
    </nav>

    <div class="main">
        <table class="list" id="funcionarios-list">
            <tr>
                <th>Nome Completo</th>
                <th>Endereço</th>
                <th>Código</th>
                <th>Salário</th>
                <th>Status</th>
                <th>Editar/Deletar</th>
            </tr>
            <tbody></tbody>
        </table>
    </div>
    
</body>
</html>
