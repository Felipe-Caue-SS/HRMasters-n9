<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro HRMasters</title>
    <link rel="stylesheet" href="style.css">
    <script src="validacao-script.js" defer></script>
</head>
<body>
    <div class="login-container">
        <img src="assets/logo-3-hrmasters.png" alt="Logo HRMasters" class="logo" id="logo-login">
        <h1>Cadastro</h1>
        <form class="form">
            <div>
                <label for="nome-input"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#F97066"><path d="M9.18,10.83Q8,9.65 8,8T9.18,5.18T12,4t2.83,1.18T16,8t-1.17,2.82T12,12T9.18,10.83ZM4,20V17.2q0-0.85 0.44-1.56q0.44-0.71 1.16-1.09q1.55-0.78 3.15-1.16T12,13t3.25,0.39t3.15,1.16q0.72,0.38 1.16,1.09T20,17.2V20H4Z"/></svg></label>
                <input type="text" name="nome" id="nome-input" placeholder="Nome completo" required>
            </div>
            <div>
                <label for="email-input">
                <span>@</span></label>
                <input type="email" name="email" id="email-input" placeholder="Email" required>
            </div>
            <div>
                <label for="senha-input"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#F97066"><path d="M6,22q-0.82,0-1.41-0.59T4,20V10Q4,9.17 4.59,8.59T6,8H7V6Q7,3.92 8.46,2.46T12,1t3.54,1.46T17,6V8h1q0.82,0 1.41,0.59T20,10V20q0,0.82-0.59,1.41T18,22H6Zm7.41-5.59Q14,15.83 14,15t-0.59-1.41T12,13t-1.41,0.59Q10,14.18 10,15t0.59,1.41T12,17t1.41-0.59ZM9,8h6V6q0-1.25-0.88-2.13T12,3T9.88,3.88T9,6V8Z"/></svg></label>
                <input type="password" name="senha" id="senha-input" placeholder="Senha" required>
            </div>
            <div>
                <label for="repetir-senha-input"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="#F97066"><path d="M6,22q-0.82,0-1.41-0.59T4,20V10Q4,9.17 4.59,8.59T6,8H7V6Q7,3.92 8.46,2.46T12,1t3.54,1.46T17,6V8h1q0.82,0 1.41,0.59T20,10V20q0,0.82-0.59,1.41T18,22H6Zm7.41-5.59Q14,15.83 14,15t-0.59-1.41T12,13t-1.41,0.59Q10,14.18 10,15t0.59,1.41T12,17t1.41-0.59ZM9,8h6V6q0-1.25-0.88-2.13T12,3T9.88,3.88T9,6V8Z"/></svg></label>
                <input type="password" name="repetir-senha" id="repetir-senha-input" placeholder="Repita a senha" required>
            </div>
            <button type="submit">CRIAR CONTA</button>
        </form>
        <br>
        <p>Já tem uma conta? <a href="login.html">Faça login.</a></p>
    </div>
</body>
</html>
